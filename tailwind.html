<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Categories Responsive</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#F8F9FC] flex justify-center py-10 px-4 min-h-screen">

  <!-- Container หลัก: ตั้งค่าขนาด Mobile ที่ 375px และขยายตาม Breakpoint จอใหญ่ -->
  <div class="w-[375px] md:w-full md:max-w-[1200px] bg-white p-6 md:p-12 rounded-[32px] shadow-sm">
    
    <!-- Header -->
    <div class="text-center mb-8 md:mb-12">
      <h2 class="text-2xl md:text-3xl font-bold text-[#1A1A2C]">
        Browse by
      </h2>
      <h1 class="text-3xl md:text-4xl font-extrabold text-[#1A1A2C] mt-1">
        <span class="relative inline-block pb-1">
          Job
          <span class="absolute bottom-0 left-0 w-full h-[6px] bg-[#FF7A00] rounded-full"></span>
        </span> 
        Categories
      </h1>
    </div>

    <!-- Grid Layout: เรียง 1 คอลัมน์ยาวลงมาในมือถือ และเป็น 4 คอลัมน์บนคอม -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 md:gap-6">

      <!-- 1. Digital Marketing -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Digital Marketing</h3>
          <p class="text-xs text-gray-400 mt-1">143 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 2. Art & Design -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Art & Design</h3>
          <p class="text-xs text-gray-400 mt-1">110 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 3. Accounting -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Accounting</h3>
          <p class="text-xs text-gray-400 mt-1">158 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 4. Photography -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Photography</h3>
          <p class="text-xs text-gray-400 mt-1">95 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 5. Copy Writing -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Copy Writing</h3>
          <p class="text-xs text-gray-400 mt-1">113 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 6. Music -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Music</h3>
          <p class="text-xs text-gray-400 mt-1">55 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 7. Human Resources -->
      <div class="bg-white border border-gray-100 rounded-[20px] p-6 shadow-[0_4px_20px_rgba(0,0,0,0.02)] flex flex-col justify-between h-[200px]">
        <div>
          <div class="w-14 h-14 rounded-full bg-[#FFF2EC] flex items-center justify-center text-[#FF7A00] mb-5">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          </div>
          <h3 class="font-bold text-[#1A1A2C] text-base">Human Resources</h3>
          <p class="text-xs text-gray-400 mt-1">25 Jobs Opened</p>
        </div>
        <div class="flex justify-end text-[#1A1A2C]">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

      <!-- 8. Explore 30 More Categories -->
      <div class="bg-gradient-to-br from-[#FF8A3D] to-[#FF6B00] rounded-[20px] p-6 text-white shadow-lg flex flex-col justify-between h-[200px] relative overflow-hidden">
        <div class="absolute -right-6 -bottom-6 w-32 h-32 rounded-full border-[16px] border-white/10 pointer-events-none"></div>
        <div class="absolute right-12 top-0 w-24 h-24 rounded-full border-[8px] border-white/10 pointer-events-none"></div>

        <div class="relative z-10">
          <h3 class="font-bold text-xl leading-snug">
            Explore<br>30 More<br>Categories
          </h3>
        </div>
        <div class="flex justify-end relative z-10 text-white font-bold">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
